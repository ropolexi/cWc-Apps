<script>
/* ===================== CONFIG ===================== */
const CONFIG = {
  L1_RPC: [
    "https://l1-12-2.diamondthumb.com/chainware-rpc"
  ],
  L2_RPC: [
    "https://l2-12-2.diamondthumb.com/chainware-rpc"
  ],
  RPC_TIMEOUT_MS: 12000,
  DEFAULT_AUTHOR: "",
  TRUSTED_AUTHORS: ["cwcf64c78637638d104843716edefb08c314d37e2d"],
  SITE_TITLE: "cWc Calm Reader",
  TAGLINE: "Pages published on the chainWare chain with on-demand chunk streaming",
  PAGE_SIZE: 8,
  CACHE_NAME: "cwc-blog-cache-v6"
};

/* ===================== STATE (100% REAL DATA ONLY) ===================== */
const $ = id => document.getElementById(id);
const dec = new TextDecoder();
let reqId = 1;

const state = {
  pages: [],           // Real posts for current author
  discoverPosts: [],   // Real posts discovered across network
  authorProfiles: new Map(), // Real username & profile map (signer -> { name, bio, image })
  controls: [],        // Real PAGE_CONTROL visibility records from network
  about: null,
  profile: null,
  done: false,
  error: "",
  loading: true,
  progress: "",
  leadIndex: 0,
  activeCategory: "All",
  activeQuery: "",
  currentTheme: localStorage.getItem("cwc:theme") || "alabaster"
};

const unb64 = s => { const b = atob(String(s||"")), a = new Uint8Array(b.length); for (let i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; };
const b64 = a => { let s=""; for (const x of a) s+=String.fromCharCode(x); return btoa(s); };
const fromHex = h => { const a = new Uint8Array(h.length/2); for (let i=0;i<a.length;i++) a[i]=parseInt(h.substr(i*2,2),16); return a; };
const toHex = a => Array.from(a, x => x.toString(16).padStart(2,"0")).join("");
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const field = (o, ...n) => { for (const k of n) if (o && o[k] != null) return o[k]; };
const cleanHash = p => String(field(p,"l2_tx_hash","L2TxHash") || "").replace(/^0x/i,"").toUpperCase();
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); };
const lc = s => String(s || "").toLowerCase();
const str = (v, n) => String(v == null ? "" : v).trim().slice(0, n);
const safeImg = u => /^(https:\/\/|data:image\/(png|jpe?g|gif|webp);base64,)/i.test(String(u||"")) ? String(u) : "";
async function sha256HexBytes(bytes){ return toHex(new Uint8Array(await crypto.subtle.digest("SHA-256", bytes))); }

const ADDR_RE = /^cw[0-9a-f]{40}$/i;
const shortAddr = a => a && a.length > 18 ? a.slice(0, 8) + "…" + a.slice(-6) : (a || "Anonymous");

let AUTHOR = "", BAD_ADDR = "";
(function () {
  const raw = (new URLSearchParams(location.search).get("cwc") || "").trim();
  const a = (raw || CONFIG.DEFAULT_AUTHOR || "").toLowerCase();
  if (!a) return;
  if (ADDR_RE.test(a)) AUTHOR = a; else BAD_ADDR = raw;
})();

const PROFILE_ACTIONS = new Set(["UPDATE_PROFILE","PROFILE"]);
const POST_ACTIONS = new Set(["SUBMIT_POST","POST","PAGE_CONTROL"]);

/* ===================== RPC LAYER ===================== */
const rpcBest = new Map();
async function rpcOne(url, method, params) {
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), CONFIG.RPC_TIMEOUT_MS);
  try {
    const r = await fetch(url.replace(/\/+$/,"") + "/", {
      method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: JSON.stringify({ jsonrpc: "2.0", id: reqId++, method, params }), cache: "no-store", signal: ctl.signal
    });
    const t = await r.text();
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const o = JSON.parse(t);
    if (o.error) throw new Error(o.error.data || o.error.message || "RPC error");
    return o.result;
  } finally { clearTimeout(tm); }
}

async function rpc(base, method, params = {}) {
  const list = (Array.isArray(base) ? base : [base]).filter(Boolean);
  const key = list.join("|"), first = rpcBest.get(key);
  const order = first ? [first, ...list.filter(u => u !== first)] : list;
  let lastErr;
  for (const url of order) {
    try { const res = await rpcOne(url, method, params); rpcBest.set(key, url); return res; }
    catch (e) { lastErr = e; }
  }
  throw lastErr || new Error("RPC nodes unreachable");
}

async function query(base, path) {
  const r = await rpc(base, "abci_query", { path, data: "", prove: false });
  const x = r?.response || {};
  if (Number(x.code || 0) !== 0) throw new Error(x.log || `Query failed: ${path}`);
  return x.value ? JSON.parse(dec.decode(unb64(x.value))) : null;
}

async function loadL2Raw(p) {
  const hash = cleanHash(p);
  if (!hash) throw new Error("Pointer without L2 hash");
  for (const h of [b64(fromHex(hash)), "0x" + hash]) {
    try { const r = await rpc(CONFIG.L2_RPC, "tx", { hash: h, prove: false }); if (r?.tx) return unb64(r.tx); } catch {}
  }
  const height = Number(field(p,"l2_height","L2Height") || 0);
  if (height < 1) throw new Error("L2 tx not found");
  const blk = await rpc(CONFIG.L2_RPC, "block", { height: String(height) });
  for (const e of blk?.block?.data?.txs || []) {
    const raw = unb64(e), d = new Uint8Array(await crypto.subtle.digest("SHA-256", raw));
    if (toHex(d).toUpperCase() === hash) return raw;
  }
  throw new Error("L2 tx not found in block");
}

async function mapLimit(items, limit, fn) {
  const out = new Array(items.length);
  let n = 0;
  async function worker() {
    while (n < items.length) {
      const i = n++;
      try { out[i] = await fn(items[i], i); } catch (e) { out[i] = { error: e }; }
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return out;
}

/* ===================== CHUNK STREAMING ===================== */
async function assembleMediaRefBlob(ref, onProgress = () => {}) {
  if (!ref?.manifest_key) throw new Error("Missing manifest key.");
  onProgress("Fetching document manifest…", 10);
  const manifestRecord = await query(CONFIG.L2_RPC, `/content/${ref.manifest_key}`);
  const manifest = manifestRecord?.content ?? manifestRecord?.Content ?? manifestRecord ?? {};
  if (manifest?.kind !== "media_manifest") throw new Error("Invalid manifest on Layer 2.");

  let entries = [];
  if (Array.isArray(manifest.chunks)) {
    entries = manifest.chunks.slice();
  } else if (Array.isArray(manifest.map_pages)) {
    const pages = manifest.map_pages.slice().sort((a,b)=>Number(a.index)-Number(b.index));
    const pageResults = await mapLimit(pages, 6, async(pageRef, index)=>{
      onProgress(`Fetching chunk map ${index+1}/${pages.length}…`, 15 + Math.floor(15 * (index+1)/pages.length));
      const record = await query(CONFIG.L2_RPC, `/content/${pageRef.key}`);
      return (record?.content ?? record?.Content ?? {}).chunks || [];
    });
    entries = pageResults.flat();
  }

  entries.sort((a,b)=>Number(a.index)-Number(b.index));

  const parts = await mapLimit(entries, 6, async(entry, index)=>{
    onProgress(`Streaming chunk ${index+1}/${entries.length}…`, 30 + Math.floor(55 * (index+1)/entries.length));
    const record = await query(CONFIG.L2_RPC, `/content/${entry.key}`);
    const content = record?.content ?? record?.Content ?? {};
    const data = content?.data ?? content?.Data;
    if (!data) throw new Error(`Missing chunk data.`);
    const bytes = unb64(data);
    const got = await sha256HexBytes(bytes);
    if (entry.sha256 && got.toLowerCase() !== String(entry.sha256).toLowerCase()) throw new Error(`SHA-256 integrity check failed.`);
    return bytes;
  });

  onProgress("Verifying cryptographic signature…", 94);
  const blob = new Blob(parts, { type: manifest.mime || ref.mime || "application/json" });
  onProgress("Ready.", 100);
  return { blob, manifest };
}

/* ===================== CACHE (IDB + MEMORY) ===================== */
const mem = new Map();
let dbp = null;
function getDb() {
  if (!dbp) dbp = new Promise(res => {
    try {
      const q = indexedDB.open(CONFIG.CACHE_NAME, 1);
      q.onupgradeneeded = () => q.result.createObjectStore("p");
      q.onsuccess = () => res(q.result);
      q.onerror = () => res(null);
    } catch { res(null); }
  });
  return dbp;
}
async function cacheGet(k) {
  if (mem.has(k)) return mem.get(k);
  const d = await getDb(); if (!d) return undefined;
  return new Promise(res => { try { const r = d.transaction("p").objectStore("p").get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); } catch { res(undefined); } });
}
async function cacheSet(k, v) {
  mem.set(k, v);
  const d = await getDb(); if (!d) return;
  try { d.transaction("p","readwrite").objectStore("p").put(v, k); } catch {}
}

function cleanImages(m) {
  const out = {};
  if (m && typeof m === "object" && !Array.isArray(m)) {
    for (const [k, v] of Object.entries(m).slice(0, 18)) {
      if (/^img\d{1,3}$/.test(k) && typeof v === "string" && /^data:image\/(jpeg|png|webp|gif);base64,/.test(v)) out[k] = v;
    }
  }
  return out;
}
function inlineImages(html, images) {
  const im = images || {};
  return String(html).replace(/cwc:(img\d{1,3})\b/g, (m, id) => im[id] || m);
}

function legacyTitle(html) {
  if (!html) return "";
  const m = String(html).match(/<h[1-3][^>]*>(.*?)<\/h[1-3]>/i);
  if (m) return m[1].replace(/<[^>]+>/g, "").trim();
  const p = String(html).match(/<p[^>]*>(.*?)<\/p>/i);
  if (p) {
    const s = p[1].replace(/<[^>]+>/g, "").trim();
    return s.length > 60 ? s.slice(0, 57) + "…" : s;
  }
  return "";
}

function isCommentOrNotBlog(c, act, key, p) {
  const a = String(act || field(p, "action", "Action") || "").toUpperCase();
  if (a === "COMMENT" || a === "REACTION" || a === "PROFILE" || a === "UPDATE_PROFILE" || a === "PAGE_CONTROL") {
    return true;
  }
  if (!c || typeof c !== "object") return true;

  const kind = String(c.kind || "").toLowerCase();
  if (kind === "comment" || kind === "reply" || kind === "reaction" || kind === "profile" || kind === "page_control") {
    return true;
  }

  // Parent / post / reply references explicitly indicate comments on another post
  if (c.parent_id || c.post_id || c.reply_to || c.comment_id || c.target_id || c.target_hash || c.thread_id || c.root_id) {
    return true;
  }

  const k = String(key || "").toLowerCase();
  if (k.startsWith("comment:") || k.includes(":comment:") || k.startsWith("reply:") || k.includes(":reply:")) {
    return true;
  }

  const docRef = c.doc_ref || c.body_ref || null;
  const hasDocRef = Boolean(docRef && (docRef.manifest_key || docRef.ManifestKey || docRef.manifest));
  const hasHtml = typeof c.html === "string" && c.html.trim().length > 0;
  const title = typeof c.title === "string" ? c.title.trim() : "";
  const rawText = String(c.text ?? c.body ?? c.message ?? "").trim();
  const hasHtmlTags = /<\/?[a-z][\s\S]*?>/i.test(rawText);

  // Must have genuine article structure (chunked document, explicit HTML, or title + substantial text)
  if (hasDocRef) return false;
  if (hasHtml && (title || c.html.trim().length > 100)) return false;
  if (title && (hasHtml || hasHtmlTags || rawText.length > 50)) return false;
  if (hasHtmlTags && rawText.length > 180) {
    const t = legacyTitle(rawText);
    if (t) return false;
  }

  return true;
}

/* ===================== RESOLVE REAL POINTER ===================== */
async function resolve(p, targetAuthor) {
  const hash = cleanHash(p);
  const signer = String(field(p,"signer","Signer") || "").toLowerCase();
  const authorKey = targetAuthor ? targetAuthor.toLowerCase() : signer;
  const ck = (authorKey || "any") + "|" + hash;
  const cached = await cacheGet(ck);
  if (cached) return cached;

  let out = { ok: false, hash, signer };
  try {
    const raw = JSON.parse(dec.decode(await loadL2Raw(p)));
    const actualSigner = String(raw.signer || "").toLowerCase();
    if (!targetAuthor || actualSigner === targetAuthor.toLowerCase()) {
      const key = String(raw?.payload?.key || "");
      let c = raw?.payload?.content;
      if (c == null) {
        try { const rec = await query(CONFIG.L2_RPC, `/content/${key}`); c = rec?.content ?? rec?.Content; } catch {}
      }
      if (c && typeof c === "object") {
        const act = String(field(p,"action","Action") || "").toUpperCase();
        const height = Number(p.created_height || p.CreatedHeight || 0);
        const l2Height = Number(field(p,"l2_height","L2Height") || 0);

        if (PROFILE_ACTIONS.has(act) || c.kind === "profile") {
          const uName = str(c.display_name || c.name || c.username, 80);
          out = {
            ok: true, kind: "profile", signer: actualSigner, hash, height, l2Height,
            name: uName,
            bio: str(c.bio || c.description, 600),
            image: safeImg(c.image || c.profile_image)
          };
          if (uName) {
            state.authorProfiles.set(actualSigner, { name: uName, bio: out.bio, image: out.image });
          }
        } else if (c.kind === "page_control") {
          const op = String(c.op || "").toLowerCase(), target = String(c.target || "");
          if ((op === "hide" || op === "show") && target) {
            out = { ok: true, kind: "control", signer: actualSigner, hash, op, target, height, l2Height };
          }
        } else if (!isCommentOrNotBlog(c, act, key, p)) {
          // Strictly authentic blog articles only (NO comments)
          const docRef = c.doc_ref || c.body_ref || null;
          let html = typeof c.html === "string" ? c.html.trim() : "";
          let title = typeof c.title === "string" ? c.title.trim() : "";
          const rawText = String(c.text ?? c.body ?? c.message ?? "").trim();

          if (!html && !docRef && rawText) {
            if (/<\/?[a-z][\s\S]*?>/i.test(rawText)) {
              html = rawText;
            } else if (title) {
              html = "<p>" + esc(rawText).replace(/\n\n+/g, "</p><p>").replace(/\n/g, "<br>") + "</p>";
            }
          }

          if (!title && html) {
            title = legacyTitle(html);
          }

          if (docRef || html.trim()) {
            const pageId = typeof c.page_id === "string" && c.page_id ? c.page_id : hash;
            const tags = (Array.isArray(c.tags) ? c.tags : String(c.tags || "").split(",")).map(t => str(t, 30)).filter(Boolean);
            let summary = str(c.summary, 320);
            if (!summary) {
              const cleanText = (rawText || html).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
              summary = cleanText.length > 200 ? cleanText.slice(0, 190) + "…" : cleanText;
            }

            out = {
              ok: true, kind: "page", signer: actualSigner, hash, pageId,
              title: title || "On-Chain Dispatch",
              doc_ref: docRef, is_bulky: !!docRef, doc_size: Number(c.doc_size || docRef?.size || 0),
              html, category: str(c.category, 40) || (tags[0] ? tags[0] : "Essays"),
              tags, summary: summary || "Click to stream and read this authentic publication…",
              role: c.role === "about" ? "about" : "",
              images: cleanImages(c.images),
              created_at: String(c.created_at || raw?.payload?.timestamp || ""),
              height, l2Height,
              readTimeMinutes: Math.max(1, Math.ceil((html || rawText || summary).replace(/<[^>]+>/g, "").split(/\s+/).length / 200))
            };
          }
        }
      }
    }
    await cacheSet(ck, out);
  } catch (e) { return { ok: false, hash, signer, transient: true }; }
  return out;
}

const byChain = (a, b) => (a.height - b.height) || (a.l2Height - b.l2Height);
function buildModel(records, extraControls = []) {
  const groups = new Map(), ctl = new Map();
  let profile = null;

  function registerControl(c) {
    if (!c || c.kind !== "control") return;
    const rawTarget = String(c.target || "").trim();
    if (!rawTarget) return;
    const norm = rawTarget.replace(/^0x/i, "").toUpperCase();
    const lower = rawTarget.toLowerCase();
    for (const key of new Set([rawTarget, norm, lower])) {
      if (!ctl.has(key)) ctl.set(key, []);
      ctl.get(key).push(c);
    }
  }

  for (const c of extraControls) registerControl(c);

  for (const r of records) {
    if (r.kind === "page") {
      if (!groups.has(r.pageId)) groups.set(r.pageId, []);
      groups.get(r.pageId).push(r);
    } else if (r.kind === "control") {
      registerControl(r);
    } else if (r.kind === "profile") {
      if (!profile || byChain(profile, r) < 0) profile = r;
      if (r.signer && r.name) {
        state.authorProfiles.set(r.signer.toLowerCase(), { name: r.name, bio: r.bio, image: r.image });
      }
    }
  }

  const out = [];
  for (const [pid, vs] of groups) {
    vs.sort(byChain);
    const first = vs[0], latest = vs[vs.length - 1];
    const hashes = vs.map(v => v.hash);
    const postSigner = (latest.signer || "").toLowerCase();

    // Check all possible identifiers for this post: pageId, hashes, with/without 0x, uppercase & lowercase
    const candidateKeys = new Set([
      pid,
      pid.toLowerCase(),
      pid.replace(/^0x/i, "").toUpperCase(),
      ...hashes,
      ...hashes.map(h => h.toLowerCase()),
      ...hashes.map(h => h.replace(/^0x/i, "").toUpperCase())
    ]);

    const matchingControls = [];
    for (const key of candidateKeys) {
      const list = ctl.get(key);
      if (list) matchingControls.push(...list);
    }

    // Filter controls authorized for this post (same author/signer) and sort by chain height
    const authorized = matchingControls
      .filter(c => !c.signer || !postSigner || c.signer.toLowerCase() === postSigner)
      .sort(byChain);

    // If latest authorized operation is "hide", filter this post out entirely!
    if (authorized.length && authorized[authorized.length - 1].op === "hide") {
      continue;
    }

    const s = latest.signer?.toLowerCase();
    const prof = state.authorProfiles.get(s);
    const authorUsername = prof?.name || shortAddr(s);

    out.push({
      hash: pid, hashes, latestHash: latest.hash, signer: latest.signer,
      authorName: authorUsername,
      title: latest.title, category: latest.category || "Essays",
      tags: latest.tags || [], summary: latest.summary,
      html: latest.html, images: latest.images, format: "html",
      doc_ref: latest.doc_ref, is_bulky: latest.is_bulky, doc_size: latest.doc_size,
      created_at: first.created_at, height: first.height, l2Height: first.l2Height,
      readTimeMinutes: latest.readTimeMinutes || 3
    });
  }
  out.sort((a,b) => b.height - a.height);
  return { pages: out.filter(p => p.role !== "about"), about: out.find(p => p.role === "about") || null, profile };
}

/* ===================== ROUTER ===================== */
function parseHash() {
  const h = (location.hash || "#/").replace(/^#/, "");
  const i = h.indexOf("?");
  return { path: (i < 0 ? h : h.slice(0, i)) || "/", params: new URLSearchParams(i < 0 ? "" : h.slice(i + 1)) };
}

function updateBrand() {
  const prof = state.profile || (AUTHOR ? state.authorProfiles.get(AUTHOR.toLowerCase()) : null);
  const name = prof?.name ? prof.name + "'s Blog" : (AUTHOR ? "Blog (" + shortAddr(AUTHOR) + ")" : CONFIG.SITE_TITLE);
  $("brand").textContent = name;
  document.title = name;
}

function route() {
  const { path } = parseHash();
  const mt = path.match(/^\/post\/([\w-]+)$/);

  $("mDiscover").classList.toggle("on", path === "/" && !AUTHOR);
  $("mAbout").classList.toggle("on", path === "/about");
  $("walletBtnLabel").textContent = AUTHOR ? "Switch Blog" : "Enter Wallet";

  if (mt) {
    viewPost(mt[1]);
  } else if (path === "/about") {
    viewAbout();
  } else if (!AUTHOR) {
    viewDiscoverHome();
  } else {
    viewAuthorHome();
  }
}

        <article class="article-card" onclick="location.hash='#/post/${esc(post.hash)}'">
          <div>
            <div class="meta-line" style="margin-bottom:6px;">
              <span class="meta-kicker">${esc(post.category)}</span>
              <span class="meta-sep">·</span>
              <span>${esc(fmtDate(post.created_at))}</span>
              ${post.is_bulky ? `<span class="meta-sep">·</span><span style="color:#2d6a4f; font-size:0.75rem;">Chunked ${(post.doc_size/1024).toFixed(0)}KB</span>` : ""}
            </div>
            <h3>${esc(post.title)}</h3>
            <p>${esc(post.summary)}</p>
          </div>
          <div class="article-card-foot">
            <span>${(post.tags||[]).map(t=>`#${esc(t)}`).join(" ")}</span>
            <span style="color:var(--accent);">Read →</span>
          </div>
        </article>
      `).join("")}
    </div>

    ${items.length === 0 && state.done ? `
      <div style="text-align:center; padding:60px 20px; background:var(--card); border:1px dashed var(--line); border-radius:12px; color:var(--muted);">
        No posts published by this wallet address yet on Layer 2.
      </div>
    ` : ""}
    ${state.loading ? `<div style="text-align:center; padding:20px; color:var(--muted); font-size:0.85rem;">Retrieving author feed from chain… ${esc(state.progress)}</div>` : ""}
  `;
}

/* ===================== POST READER ===================== */
async function viewPost(id) {
  const m = $("main");
  const all = [...state.pages, ...state.discoverPosts];
  const post = all.find(p => p.hash === id || (p.hashes && p.hashes.includes(id)));

  if (!post) {
    m.innerHTML = `<div class="reader-container"><button class="back-btn" onclick="location.hash='#/'">← Return</button><div style="margin-top:20px; color:var(--muted);">Loading...If you dont see any results data is not there.</div></div>`;
    return;
  }

  document.title = post.title + " · " + CONFIG.SITE_TITLE;
  window.scrollTo(0, 0);

  const authorName = post.authorName || state.authorProfiles.get(post.signer?.toLowerCase())?.name || shortAddr(post.signer);

  m.innerHTML = `
    <div class="reader-container">
      <div class="reader-top">
        <button class="back-btn" onclick="location.hash='#/'">← ${AUTHOR ? "All Author Posts" : "Discover Feed"}</button>
        <div class="reader-tools">
          <button class="tool-btn" id="ttsBtn" title="Listen with Audio Reader">🔊 Listen</button>
          <button class="tool-btn" id="copyBtn" title="Share link">Share</button>
        </div>
      </div>

      <div class="post-header">
        <div class="meta-line" style="margin-bottom:8px;">
          <span class="meta-kicker">${esc(post.category)}</span>
          <span class="meta-sep">·</span>
          <span>${esc(fmtDate(post.created_at))}</span>
          <span class="meta-sep">·</span>
          <span>${post.readTimeMinutes || 3} min read</span>
          ${post.is_bulky ? `<span class="meta-sep">·</span><span style="color:#2d6a4f;">Chunked ${(post.doc_size/1024).toFixed(0)}KB</span>` : ""}
        </div>
        <h1>${esc(post.title)}</h1>
        <div style="font-size:0.85rem; color:var(--muted); display:flex; align-items:center; gap:8px;">
          <span>Posted by: <strong style="color:var(--ink);">${esc(authorName)}</strong></span>
          <span class="meta-sep">·</span>
          <button onclick="setAuthor('${esc(post.signer)}')" style="font-family:ui-monospace,monospace; color:var(--accent); text-decoration:underline;">${esc(shortAddr(post.signer))}</button>
        </div>
      </div>

      <div class="reading-frame" id="frameBox">
        <div class="chunk-loader" id="loaderBox" style="${post.html ? 'display:none;' : ''}">
          <div class="chunk-loader-title">Streaming on-chain document from Layer 2…</div>
          <div class="chunk-bar"><div class="chunk-fill" id="fillBar"></div></div>
          <div class="chunk-status" id="chunkStatus">Contacting Layer 2 nodes…</div>
        </div>
        <iframe id="postIframe" style="${post.html ? '' : 'display:none;'}"></iframe>
      </div>

      <div style="margin-top:24px; text-align:center;">
        <button class="btn-subtle" onclick="setAuthor('${esc(post.signer)}')">Explore all publications by ${esc(authorName)} →</button>
      </div>
    </div>
  `;

  let speaking = false;
  $("ttsBtn").addEventListener("click", () => {
    if (!window.speechSynthesis) return;
    if (speaking) {
      window.speechSynthesis.cancel();
      speaking = false;
      $("ttsBtn").textContent = "🔊 Listen";
    } else {
      const text = post.title + ". " + (post.summary || "");
      const u = new SpeechSynthesisUtterance(text);
      u.onend = () => { speaking = false; $("ttsBtn").textContent = "🔊 Listen"; };
      window.speechSynthesis.speak(u);
      speaking = true;
      $("ttsBtn").textContent = "⏹ Stop";
    }
  });

  $("copyBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(location.href);
    $("copyBtn").textContent = "Copied!";
    setTimeout(() => $("copyBtn").textContent = "Share", 2000);
  });

  if (!post.html && post.doc_ref) {
    try {
      const assembled = await assembleMediaRefBlob(post.doc_ref, (label, pct) => {
        if ($("fillBar")) $("fillBar").style.width = pct + "%";
        if ($("chunkStatus")) $("chunkStatus").textContent = label;
      });
      const text = await assembled.blob.text();
      const doc = JSON.parse(text);
      post.html = doc.html || "";
      post.images = cleanImages(doc.images || {});
    } catch (e) {
      if ($("chunkStatus")) $("chunkStatus").textContent = "Error loading chunks: " + e.message;
      return;
    }
  }

  const ifr = $("postIframe");
  if (ifr && post.html) {
    if ($("loaderBox")) $("loaderBox").style.display = "none";
    ifr.style.display = "block";
    const body = inlineImages(post.html, post.images);
    const css = `
      body {
        margin:0; padding:24px 20px;
        font-family: 'Newsreader', 'Lora', Georgia, serif;
        font-size: 19px; line-height: 1.85;
        color: ${state.currentTheme === 'dusk' ? '#EAE5DE' : '#221F1C'};
        background: ${state.currentTheme === 'dusk' ? '#201E1B' : '#FFFFFF'};
      }
      p { margin: 0 0 1.5em; }
      h1,h2,h3 { font-family: 'Plus Jakarta Sans', sans-serif; line-height: 1.3; }
      a { color: #845B38; }
      img,video,svg { max-width: 100%; border-radius: 8px; }
      blockquote { border-left: 3px solid #D9D2C6; padding: 0.5em 1.4em; margin: 1.5em 0; font-style: italic; }
    `;
    ifr.setAttribute("sandbox", "allow-same-origin allow-popups");
    ifr.srcdoc = `<!doctype html><html><head><base target="_blank"><style>${css}</style></head><body>${body}</body></html>`;
    const fit = () => {
      try {
        const d = ifr.contentDocument;
        if (d) ifr.style.height = Math.max(220, d.documentElement.scrollHeight) + "px";
      } catch {}
    };
    ifr.addEventListener("load", fit);
    setTimeout(fit, 300);
  }
}

/* ===================== ABOUT VIEW ===================== */
function viewAbout() {
  updateBrand();
  const m = $("main");
  const p = state.profile || (AUTHOR ? state.authorProfiles.get(AUTHOR.toLowerCase()) : null);
  m.innerHTML = `
    <div class="reader-container">
      <button class="back-btn" onclick="location.hash='#/'" style="margin-bottom:20px;">← Back to Home</button>
      <div style="background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px; text-align:center;">
        <div class="author-avatar" style="width:72px; height:72px; margin:0 auto 16px; font-size:1.8rem;">

        </div>

          ${esc(p?.name || "Authentic cWc Reader")}

        <p style="color:var(--muted); max-width:500px; margin:0 auto 20px; font-family:var(--font-serif); font-size:1.05rem; line-height:1.7;">

        </p>
        <div style="font-family:ui-monospace,monospace; font-size:0.8rem; color:var(--muted);">

/* ===================== RANDOM POST ACTION ===================== */
$("randomBtn").addEventListener("click", () => {
  const pool = state.pages.length ? state.pages : state.discoverPosts;
  if (!pool.length) return;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  location.hash = "#/post/" + pick.hash;
});

$("walletBtn").addEventListener("click", () => {
  if (AUTHOR) {
    location.href = location.pathname;
  } else {
    const el = $("addrInput");
    if (el) {
      el.scrollIntoView({ behavior: "smooth" });
      el.focus();
    } else {
      location.hash = "#/";
      setTimeout(() => { const i = $("addrInput"); if(i) i.focus(); }, 100);
    }
  }
});

/* ===================== AUTHENTIC ON-CHAIN LOADER ===================== */
async function loadLiveFeed() {
  state.loading = true;
  state.error = "";
  if ($("initStatus")) $("initStatus").textContent = "Connecting to Layer 1 RPC...";

  try {
    const raw = await query(CONFIG.L1_RPC, "/l2-pointers");
    const list = Array.isArray(raw) ? raw : Object.values(raw || {});

    // 1. First, index all profiles from UPDATE_PROFILE pointers
    const profPointers = list.filter(p => PROFILE_ACTIONS.has(String(field(p, "action", "Action") || "").toUpperCase()));
    if ($("initStatus")) $("initStatus").textContent = `Resolving ${profPointers.length} creator profiles from chain…`;

    await mapLimit(profPointers, 6, async p => {
      const r = await resolve(p);
      if (r.ok && r.kind === "profile" && r.signer && r.name) {
        state.authorProfiles.set(r.signer.toLowerCase(), { name: r.name, bio: r.bio, image: r.image });
      }
    });

    // 2. Index all PAGE_CONTROL pointers across the chain to enforce hiding globally on the main index
    const controlPointers = list.filter(p => {
      const a = String(field(p, "action", "Action") || "").toUpperCase();
      return a === "PAGE_CONTROL" || a === "CONTROL";
    });
    if ($("initStatus")) $("initStatus").textContent = `Syncing publication visibility controls (${controlPointers.length})…`;

    const allControls = [];
    await mapLimit(controlPointers, 6, async p => {
      const r = await resolve(p);
      if (r.ok && r.kind === "control") {
        allControls.push(r);
      }
    });
    state.controls = allControls;

    if (AUTHOR) {
      // 3. Author specific mode
      const mine = list.filter(p => String(field(p,"signer","Signer") || "").toLowerCase() === AUTHOR);
      const found = new Map();
      let cnt = 0;
      await mapLimit(mine, 6, async p => {
        const r = await resolve(p, AUTHOR);
        if (r.ok) found.set(r.hash, r);
        Object.assign(state, buildModel([...found.values()], state.controls));
        state.progress = `${++cnt} of ${mine.length} pointers indexed`;
        if (location.hash === "#/" || !location.hash) viewAuthorHome();
      });
    } else {
      // 4. Network Discovery: 100% real blog posts across all creators, filtering out hidden posts entirely
      const postPointers = list
        .filter(p => {
          const a = String(field(p, "action", "Action") || "").toUpperCase();
          if (["COMMENT","REACTION","PAGE_CONTROL","UPDATE_PROFILE","PROFILE"].includes(a)) return false;
          if (p.parent_id || p.post_id || p.reply_to || p.target_id || p.comment_id) return false;
          return a === "SUBMIT_POST" || a === "POST";
        })
        .sort((a,b) => Number(b.created_height || b.CreatedHeight || 0) - Number(a.created_height || a.CreatedHeight || 0));

      if ($("initStatus")) $("initStatus").textContent = `Found ${postPointers.length} on-chain publication pointers. Verifying articles…`;

      // Scan candidate pointers to discover real blog articles
      const sample = postPointers.slice(0, 50);
      const foundRecords = [];
      let cnt = 0;

      await mapLimit(sample, 6, async p => {
        const r = await resolve(p);
        if (r.ok) {
          if (r.kind === "control") {
            state.controls.push(r);
          } else if (r.kind === "page") {
            // Check if author profile is already cached; if not, query /content/profile:<signer>
            const signerLower = r.signer.toLowerCase();
            if (!state.authorProfiles.has(signerLower)) {
              try {
                const rec = await query(CONFIG.L2_RPC, `/content/profile:${signerLower}`);
                const c = rec?.content ?? rec?.Content;
                if (c) {
                  const uName = str(c.display_name || c.name || c.username, 80);
                  if (uName) {
                    state.authorProfiles.set(signerLower, { name: uName, bio: str(c.bio, 600), image: safeImg(c.image) });
                  }
                }
              } catch {}
            }
            foundRecords.push(r);
          }
        }
        state.progress = `Resolved ${++cnt} of ${sample.length} on-chain posts (hidden filtered)`;
        if ($("initStatus")) $("initStatus").textContent = state.progress;
      });

      if (foundRecords.length > 0) {
        const model = buildModel(foundRecords, state.controls);
        state.discoverPosts = model.pages;
      }
    }
  } catch (e) {
    state.error = e.message;
    if ($("initStatus")) $("initStatus").textContent = "RPC query error: " + e.message;
  }

  state.loading = false;
  state.done = true;
  route();
}

// Initial start
route();
loadLiveFeed();
</script>
